; WiFi/network benchmark for the XIAO ESP32-S3 Plus.
; Measures the sync/OTA path: STA connect time, NTP, HTTP LAN download
; throughput, and HTTPS handshake + TLS heap. See README.md.
;
; !! Attach the U.FL antenna before running — this board variant has no onboard
;    trace, and running WiFi with no antenna can damage the radio.

[env:xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi   ; change to qio_qspi if PSRAM isn't detected

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1     ; report prints over native USB-CDC

; WiFi, HTTPClient, WiFiClientSecure all ship with the arduino-esp32 framework.


; -----------------------------------------------------------------------------
; TUNED env — bumps the tiny arduino TCP window (5760 B) + WiFi buffers to lift
; LAN throughput ~10x. The official platform ships precompiled libs with a fixed
; sdkconfig, so this uses the pioarduino fork (Arduino 3.x / IDF 5.x), whose
; `custom_sdkconfig` rebuilds the framework from source. FIRST BUILD IS LONG
; (large download + full framework compile, ~20-40 min). Same source code.
;   pio run -e xiao_s3_tuned -t upload -t monitor
; Compare its "LAN service" MB/s against the baseline `xiao_s3` env.
; -----------------------------------------------------------------------------
[env:xiao_s3_tuned]
extends = env:xiao_s3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=65535
    CONFIG_LWIP_TCP_SND_BUF_DEFAULT=65535
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=64
    CONFIG_LWIP_WND_SCALE=y
    CONFIG_LWIP_TCP_RCV_SCALE=2
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=24
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=64
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=64
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=32
    CONFIG_ESP_WIFI_RX_BA_WIN=32
    CONFIG_LWIP_IRAM_OPTIMIZATION=y
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
